<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>NOS Nieuwsraadsel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;900&family=Spline+Sans+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* NOS huisstijl — overgenomen uit nos-next/design-system */
    --page:#ffffff;          /* surface.page.default */
    --warmgrijs:#f3f3f0;     /* foundation.nosWarmGrijs */
    --ink:#202020;           /* foundation.blackOut — distinct tekst */
    --ink-soft:#666666;      /* foundation.kabel */
    --ink-faint:#888888;     /* foundation.ether */
    --antenna:#bfbfbf;       /* foundation.antenna */
    --rule:#dddddd;          /* foundation.ruis */
    --rule-soft:#eeeeee;     /* foundation.radiostilte */
    --clue-bg:#f3f3f0;       /* warmgrijs aanwijsvakje */
    --clue-ink:#444444;      /* foundation.beeldbuis */
    --block:#202020;         /* blackOut geblokkeerd vakje */
    --cell:#ffffff;
    --accent:#e61e14;        /* foundation.nosRood */
    --accent-deep:#ca1a12;   /* foundation.nosRood100 */
    --active:#ffc6c6;        /* nosRoodMinus400 — actieve cel */
    --active-line:#ffe2e2;   /* nosRoodMinus500 — actief woord */
    --sport:#284bbe;         /* foundation.sportBlauw */
    --ok:#00c678;            /* foundation.jeugdGroen */
    --bad:#e61e14;           /* nosRood */
    --display:"Archivo",Helvetica,Arial,sans-serif;
    --narrow:"Archivo",Helvetica,Arial,sans-serif;
    --mono:"Spline Sans Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
    --body:"Helvetica Neue",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--page);
    color:var(--ink);
    font-family:var(--body);
    -webkit-font-smoothing:antialiased;
    line-height:1.4;
    padding:18px 14px 60px;
  }
  .wrap{max-width:760px;margin:0 auto}

  /* ---- kop ---- */
  header{border-bottom:3px solid var(--ink);padding-bottom:10px}
  .eyebrow{
    display:flex;align-items:center;gap:8px;
    font-family:var(--narrow);font-weight:700;
    text-transform:uppercase;letter-spacing:.14em;font-size:12px;
  }
  .eyebrow .dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
  .eyebrow .left{flex:1;display:flex;align-items:center;gap:8px}
  .eyebrow .logo{height:20px;width:auto;flex:none}
  .eyebrow .right{flex:1;text-align:right;color:var(--ink-faint);letter-spacing:.08em}
  .eyebrow .weeknav{display:flex;align-items:center;justify-content:flex-end;gap:6px}
  .wk-btn{
    font-family:var(--narrow);font-weight:700;font-size:15px;line-height:1;
    width:22px;height:22px;padding:0;border:1.5px solid var(--rule);background:var(--page);
    color:var(--ink);border-radius:4px;cursor:pointer;transition:.12s;
    display:inline-flex;align-items:center;justify-content:center
  }
  .wk-btn:hover:not(:disabled){background:var(--ink);color:var(--page);border-color:var(--ink)}
  .wk-btn:disabled{opacity:.35;cursor:default}
  .wk-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media print{.weeknav .wk-btn{display:none}}
  h1{
    font-family:var(--display);font-weight:900;
    font-size:clamp(34px,9vw,58px);line-height:.92;
    margin:.18em 0 .12em;letter-spacing:-.02em;text-transform:uppercase;
  }
  h1 em{font-style:normal;color:var(--accent)}
  .dek{font-family:var(--body);font-size:14px;color:var(--ink-soft);max-width:46ch}

  /* ---- ticker / actieve aanwijzing ---- */
  .ticker{
    margin:14px 0 12px;background:var(--ink);color:#fff;
    border-radius:4px;display:flex;align-items:stretch;overflow:hidden;
    min-height:52px
  }
  .ticker .tag{
    background:var(--accent);color:#fff;display:flex;align-items:center;
    padding:0 12px;font-family:var(--narrow);font-weight:700;
    text-transform:uppercase;letter-spacing:.08em;font-size:12px;white-space:nowrap
  }
  .ticker .txt{display:flex;align-items:center;padding:8px 14px;font-size:clamp(15px,3.6vw,19px);font-weight:500}
  .ticker .txt b{font-weight:700}
  .ticker .meta{margin-left:auto;display:flex;align-items:center;padding:0 14px;font-family:var(--mono);font-size:12px;color:var(--antenna);white-space:nowrap}

  /* ---- rooster ---- */
  .board-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px;margin:0 -14px;padding-left:14px;padding-right:14px}
  .board{
    --cs:42px;
    display:grid;width:max-content;margin:0 auto;
    border:2px solid var(--ink);background:var(--ink);
    gap:1px;
  }
  @media(max-width:560px){.board{--cs:38px}}
  .cell{width:var(--cs);height:var(--cs);position:relative;background:var(--block)}
  .cell.letter{background:var(--cell)}
  .cell.clue{background:var(--clue-bg)}
  .cell.letter.hl{background:var(--active-line)}
  .cell.letter.cur{background:var(--active)}
  /* barred grid: dikke wand tussen letters die geen woord delen */
  .cell.bar-r::before{content:"";position:absolute;top:0;right:0;bottom:0;width:3px;
    background:var(--ink);z-index:2;pointer-events:none}
  .cell.bar-b::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
    background:var(--ink);z-index:2;pointer-events:none}
  /* ---- oplossingswoord: genummerde cellen + balk ---- */
  .cell .solno{position:absolute;top:0;left:2px;font-family:var(--narrow);
    font-weight:700;font-size:calc(var(--cs)*.2);color:var(--accent-deep);
    line-height:1.1;z-index:2;pointer-events:none}
  .solbar{margin-top:14px}
  .solbar[hidden]{display:none}
  .solbar .sol-label{font-family:var(--narrow);font-weight:700;text-transform:uppercase;
    letter-spacing:.08em;font-size:12px;color:var(--ink-soft);margin-bottom:8px}
  .solbar .sol-cells{display:flex;flex-wrap:wrap;gap:5px}
  .solbar .sol-cell{width:34px;height:34px;border:2px solid var(--ink);border-radius:4px;
    position:relative;display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-weight:600;font-size:17px;background:var(--cell);cursor:pointer}
  .solbar .sol-cell .n{position:absolute;top:-7px;left:-5px;background:var(--accent);color:#fff;
    border-radius:50%;width:14px;height:14px;font-family:var(--narrow);font-weight:700;
    font-size:9px;display:flex;align-items:center;justify-content:center}
  .cell input{
    width:100%;height:100%;border:0;background:transparent;text-align:center;
    font-family:var(--mono);font-weight:600;
    font-size:calc(var(--cs)*.5);text-transform:uppercase;color:var(--ink);
    padding:0;caret-color:var(--accent);outline:none
  }
  .cell input:focus{background:var(--active)}
  .cell.bad input{color:var(--bad)}
  .cell.ok input{color:var(--ok)}
  /* aanwijstekst in vakje */
  .clue .ctext{
    position:absolute;inset:2px 3px;font-family:var(--narrow);font-weight:600;
    font-size:8.5px;line-height:1.04;color:var(--clue-ink);overflow:hidden;
    display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;cursor:pointer
  }
  .cell.clue{cursor:pointer}
  /* bij twee aanwijzingen in één vakje is er maar één tegelijk zichtbaar; klik wisselt */
  .clue .ctext.off,.clue .cnum.off{display:none!important}
  /* pijlen */
  .arrow{position:absolute;width:0;height:0;z-index:2;pointer-events:none}
  .arrow.right{right:-6px;top:50%;transform:translateY(-50%);
    border-top:4px solid transparent;border-bottom:4px solid transparent;border-left:6px solid var(--accent-deep)}
  .arrow.down{bottom:-6px;left:50%;transform:translateX(-50%);
    border-left:4px solid transparent;border-right:4px solid transparent;border-top:6px solid var(--accent-deep)}
  /* nummer in aanwijsvakje — alleen op mobiel i.p.v. de tekst */
  .clue .cnum{position:absolute;inset:2px 3px;display:none;align-items:center;justify-content:center;
    font-family:var(--narrow);font-weight:700;color:var(--clue-ink);font-size:calc(var(--cs)*.42);cursor:pointer}
  @media(max-width:560px){
    .clue .ctext{display:none}
    .clue .cnum{display:flex}
  }
  .clue.sel .ctext{color:var(--accent-deep)}
  .clue.sel{background:var(--active-line)}

  /* ---- knoppen ---- */
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px}
  button{
    font-family:var(--narrow);font-weight:700;text-transform:uppercase;letter-spacing:.05em;
    font-size:13px;padding:9px 14px;border:2px solid var(--ink);background:var(--page);
    color:var(--ink);border-radius:4px;cursor:pointer;transition:.12s
  }
  button:hover{background:var(--ink);color:var(--page)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{background:var(--accent-deep);border-color:var(--accent-deep)}
  button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  /* artikelknop bij geselecteerd woord */
  .article-btn{
    font-family:var(--narrow);font-weight:700;text-transform:uppercase;letter-spacing:.05em;
    font-size:13px;padding:9px 14px;border:2px solid var(--accent);background:var(--accent);
    color:#fff;border-radius:4px;cursor:pointer;transition:.12s;text-decoration:none;
    display:inline-flex;align-items:center;gap:6px
  }
  .article-btn:hover{background:var(--accent-deep);border-color:var(--accent-deep)}
  .article-btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .article-btn[hidden]{display:none}
  .prog{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--ink-soft)}
  .prog b{color:var(--ink)}

  .status{margin-top:12px;font-family:var(--narrow);font-size:14px;min-height:20px}
  .status.win{color:var(--ok);font-weight:700;font-size:16px}
  .status.miss{color:var(--bad);font-weight:700}

  /* ---- bronnenlijst ---- */
  details{margin-top:22px;border-top:1px solid var(--rule);padding-top:12px}
  summary{font-family:var(--narrow);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:12px;cursor:pointer;color:var(--ink-soft)}
  .cluelist{display:grid;grid-template-columns:1fr 1fr;column-gap:26px;margin-top:10px;font-size:13px}
  @media(max-width:520px){.cluelist{grid-template-columns:1fr}}
  .cluelist div{margin-bottom:5px}
  .cluelist .n{font-family:var(--mono);color:var(--accent-deep);font-weight:600;margin-right:5px}
  footer{margin-top:26px;border-top:3px solid var(--ink);padding-top:8px;font-family:var(--narrow);font-size:11px;color:var(--ink-faint);letter-spacing:.04em;text-transform:uppercase}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  /* ---- afdrukken (A4): rooster met nummers + aanwijzingenlijst, geen knoppen ---- */
  @media print{
    @page{size:A4;margin:12mm}
    body{padding:0;color:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .ticker,.bar,.status{display:none!important}      /* help, lees-artikel, voortgang enz. */
    header{border-bottom-width:2px;padding-bottom:5px}
    h1{font-size:30px;margin:.08em 0}                   /* compacte kop op papier */
    /* !important overruled de inline --cs van het scherm, zodat het rooster op A4 past */
    .board{--cs:8mm!important;margin:4mm auto}
    .board-scroll{overflow:visible;margin:0;padding:0}
    .clue .ctext,.clue .ctext.off{display:none!important}  /* nummers i.p.v. tekst in de vakjes */
    .clue .cnum,.clue .cnum.off{display:flex!important}     /* op papier allebei de nummers tonen */
    .clue.multi .cnum0{inset:1px 3px auto;height:45%}
    .clue.multi .cnum1{inset:auto 3px 1px;height:45%}
    details{border-top:2px solid #000;margin-top:6mm}
    summary{display:none}                               /* lijst altijd uitklappen, geen toggle */
    .cluelist{display:grid;grid-template-columns:1fr 1fr;font-size:11px}
    .cell input{color:#000}
    .clue.sel{background:var(--clue-bg)}                /* geen selectie-accent op papier */
    /* compacte oplossingsbalk zodat alles op één A4 blijft */
    .solbar{margin-top:2mm}
    .solbar .sol-label{margin-bottom:1.5mm}
    .solbar .sol-cells{gap:1.2mm}
    .solbar .sol-cell{width:6mm;height:6mm;font-size:11px;border-width:1.5px}
    .solbar .sol-cell .n{width:2.6mm;height:2.6mm;font-size:5pt;top:-1.2mm;left:-1mm}
    footer{margin-top:3mm}
    a[href]::after{content:""}                          /* geen URL's achter links afdrukken */
  }
</style>
</head>

<div class="wrap">
  <header>
    <div class="eyebrow"><span class="left"><span class="dot"></span>Puzzel</span><img class="logo" src="https://upload.wikimedia.org/wikipedia/commons/b/b9/NOS_logo.svg" alt="NOS"><span class="right weeknav"><button class="wk-btn" id="wk-prev" type="button" aria-label="Vorige week">‹</button><span id="ed-week"></span><button class="wk-btn" id="wk-next" type="button" aria-label="Volgende week">›</button></span></div>
    <h1>Het <em>Nieuws</em>raadsel</h1>
  </header>

  <div class="ticker">
    <span class="tag" id="tk-tag">Tik een vakje</span>
    <span class="txt" id="tk-txt">Kies een grijs vakje of een letter om te beginnen.</span>
    <span class="meta" id="tk-meta"></span>
  </div>

  <div class="board-scroll">
    <div class="board" id="board"></div>
  </div>

  <div class="solbar" id="solbar" hidden>
    <div class="sol-label">Woord van de week</div>
    <div class="sol-cells" id="sol-cells"></div>
  </div>

  <div class="bar">
    <button class="primary" id="btn-check">Controleer</button>
    <button id="btn-help">Help!</button>
    <button id="btn-clear">Wissen</button>
    <button id="btn-print">Afdrukken</button>
    <a id="btn-article" class="article-btn" target="_blank" rel="noopener" hidden>Lees het artikel →</a>
    <span class="prog" id="prog">0 / 0</span>
  </div>
  <div class="status" id="status"></div>

  <details>
    <summary>Alle aanwijzingen (lijst)</summary>
    <div class="cluelist" id="cluelist"></div>
  </details>

  <footer id="ed-footer">Nieuwsraadsel · gemaakt op basis van nos.nl</footer>
</div>

const key=(r,c)=>r+","+c;
const board=document.getElementById('board');

// muteerbare staat — mount() (her)initialiseert dit per week
let DATA, cellMap, wordsAt, inputs, clueEls, STORE_KEY;
let SOL=null, solAt;          // oplossingswoord + celindex -> volgnummer
let active={word:null,k:null};
let current=0;                // index in WEEKS (0 = nieuwste week)

function mount(data){
  DATA=data;
  active={word:null,k:null};
  board.innerHTML='';
  board.style.gridTemplateColumns=`repeat(${DATA.cols}, var(--cs))`;
  board.style.gridTemplateRows=`repeat(${DATA.rows}, var(--cs))`;

  // index: "r,c" -> celdata
  cellMap=new Map();
  DATA.cells.forEach(c=>cellMap.set(key(c.r,c.c),c));

  // oplossingswoord: "r,c" -> volgnummer (1-based) van de cirkelcellen
  SOL=DATA.solution||null;
  solAt=new Map();
  if(SOL) SOL.cells.forEach((c,i)=>solAt.set(key(c.r,c.c),i+1));

  // nummer elke aanwijzing in leesvolgorde (mobiel toont het nummer i.p.v. de tekst)
  let _clueNo=0;
  DATA.cells.filter(c=>c.type==='clue').sort((a,b)=>a.r-b.r||a.c-b.c)
    .forEach(c=>c.clues.forEach(cl=>cl.num=++_clueNo));

  // woordmembership per lettercel: "r,c" -> [wordObj...]
  wordsAt=new Map();
  DATA.words.forEach((w,wi)=>{
    const dr=w.dir==='H'?0:1, dc=w.dir==='H'?1:0;
    w.idx=wi; w.cells=[];
    for(let i=0;i<w.word.length;i++){
      const k=key(w.r+dr*i,w.c+dc*i);
      w.cells.push(k);
      if(!wordsAt.has(k)) wordsAt.set(k,[]);
      wordsAt.get(k).push(w);
    }
  });

  inputs=new Map();             // "r,c" -> input element
  clueEls=new Map();            // "r,c" -> {el, parts:[{t,num}]} van aanwijsvakjes
  STORE_KEY=storeKeyFor(DATA);

  applyWeekChrome();
  render(); buildSolBar(); buildList(); fitBoard();
  restoreProgress();
  const s=document.getElementById('status'); s.textContent=''; s.className='status';
}

function render(){
  for(let r=0;r<DATA.rows;r++){
    for(let c=0;c<DATA.cols;c++){
      const d=cellMap.get(key(r,c));
      const el=document.createElement('div');
      el.className='cell';
      if(!d){ board.appendChild(el); continue; }
      if(d.type==='letter'){
        el.classList.add('letter');
        if(d.barRight) el.classList.add('bar-r');
        if(d.barBottom) el.classList.add('bar-b');
        const inp=document.createElement('input');
        inp.maxLength=1; inp.inputMode='text'; inp.autocapitalize='characters';
        inp.dataset.k=key(r,c);
        inp.addEventListener('focus',()=>onFocus(key(r,c)));
        inp.addEventListener('input',onInput);
        inp.addEventListener('keydown',onKey);
        inp.addEventListener('click',()=>toggleDir(key(r,c)));
        el.appendChild(inp);
        inputs.set(key(r,c),inp);
        const sn=solAt.get(key(r,c));
        if(sn){
          const no=document.createElement('span'); no.className='solno'; no.textContent=sn; el.appendChild(no);
        }
      } else {
        el.classList.add('clue');
        if(d.clues.length>1) el.classList.add('multi');
        d.shown=0;                                       // welke aanwijzing zichtbaar is
        const parts=[];
        d.clues.forEach((cl,i)=>{
          const t=document.createElement('div');
          t.className='ctext'+(i?' off':'');
          t.textContent=cl.text;
          const num=document.createElement('span');     // mobiel/print: nummer i.p.v. tekst
          num.className='cnum cnum'+i+(i?' off':'');
          num.textContent=cl.num;
          const ar=document.createElement('span');       // richtingspijl (CSS-driehoek)
          ar.className='arrow '+cl.arrow;
          el.appendChild(t);
          el.appendChild(num);
          el.appendChild(ar);
          parts.push({t,num});
        });
        el.addEventListener('click',()=>clickClueCell(d));
        clueEls.set(key(r,c),{el,parts});
      }
      board.appendChild(el);
    }
  }
  updateProgress();
}

function wordForClue(d,cl){
  const dr=cl.arrow==='right'?0:1, dc=cl.arrow==='right'?1:0;
  const sr=d.r+dr, sc=d.c+dc;
  return DATA.words.find(w=>w.r===sr&&w.c===sc&&((cl.arrow==='right')===(w.dir==='H')));
}
function selectClue(d,cl){
  const w=wordForClue(d,cl); if(!w) return;
  active.word=w; setActiveCell(w.cells[0],true); highlight();
  inputs.get(w.cells[0]).focus();
}
function showClue(d,i){
  d.shown=i;
  const rec=clueEls.get(key(d.r,d.c)); if(!rec) return;
  rec.parts.forEach((p,j)=>{p.t.classList.toggle('off',j!==i);p.num.classList.toggle('off',j!==i);});
}
function clickClueCell(d){
  let i=d.shown||0;
  // tweede klik op hetzelfde vakje: wissel naar de andere richting
  if(d.clues.length>1 && active.word && wordForClue(d,d.clues[i])===active.word){
    i=(i+1)%d.clues.length;
    showClue(d,i);
  }
  selectClue(d,d.clues[i]);
}
function onFocus(k){
  active.k=k;
  const ws=wordsAt.get(k)||[];
  if(!active.word || !active.word.cells.includes(k)) active.word=ws[0]||null;
  highlight();
}
function toggleDir(k){
  const ws=wordsAt.get(k)||[];
  if(ws.length>1 && active.word){
    const other=ws.find(w=>w!==active.word);
    if(other && active.k===k){ active.word=other; highlight(); }
  }
}
function setActiveCell(k,focus){active.k=k; if(focus&&inputs.get(k)) inputs.get(k).focus();}

function highlight(){
  document.querySelectorAll('.cell.letter').forEach(el=>el.classList.remove('hl','cur'));
  document.querySelectorAll('.cell.clue').forEach(el=>el.classList.remove('sel'));
  if(active.word){
    active.word.cells.forEach(k=>{const el=inputs.get(k)?.parentElement; if(el) el.classList.add('hl');});
    // markeer bijbehorend clue-vakje en toon daar de juiste aanwijzing
    const w=active.word;const dr=w.dir==='H'?0:1,dc=w.dir==='H'?1:0;
    const kk=key(w.r-dr,w.c-dc);
    const cd=cellMap.get(kk);
    if(cd&&cd.type==='clue'){
      const rec=clueEls.get(kk);
      if(rec) rec.el.classList.add('sel');
      const ci=cd.clues.findIndex(x=>wordForClue(cd,x)===w);
      if(ci>=0&&ci!==cd.shown) showClue(cd,ci);
    }
    updateTicker();
  }
  if(active.k){const el=inputs.get(active.k)?.parentElement; if(el) el.classList.add('cur');}
  updateArticleBtn();
}

function updateArticleBtn(){
  const a=document.getElementById('btn-article');
  const w=active.word;
  if(w&&w.url){ a.href=w.url; a.title=w.title||''; a.hidden=false; }
  else { a.hidden=true; a.removeAttribute('href'); }
}

function updateTicker(){
  const w=active.word; if(!w) return;
  const dr=w.dir==='H'?0:1,dc=w.dir==='H'?1:0;
  const cd=cellMap.get(key(w.r-dr,w.c-dc));
  const cl=cd?.clues?.find(x=>wordForClue(cd,x)===w);
  document.getElementById('tk-tag').textContent=(w.dir==='H'?'→ Horizontaal':'↓ Verticaal');
  document.getElementById('tk-txt').innerHTML=cl?cl.text:'';
  document.getElementById('tk-meta').textContent=w.word.length+' letters';
}

function nextCell(k,back){
  const w=active.word; if(!w) return null;
  const i=w.cells.indexOf(k); if(i<0) return null;
  const j=back?i-1:i+1;
  return (j>=0&&j<w.cells.length)?w.cells[j]:null;
}
function onInput(e){
  const inp=e.target; const k=inp.dataset.k;
  inp.value=(inp.value||'').toUpperCase().replace(/[^A-Z]/g,'').slice(-1);
  inp.parentElement.classList.remove('bad','ok');
  if(inp.value){const n=nextCell(k,false); if(n) inputs.get(n).focus();}
  updateProgress(); saveProgress();
}
function onKey(e){
  const k=e.target.dataset.k;
  if(e.key==='Backspace'&&!e.target.value){const p=nextCell(k,true); if(p){inputs.get(p).focus();inputs.get(p).value='';e.preventDefault();updateProgress();saveProgress();}}
  else if(e.key==='ArrowRight') move(k,0,1,e);
  else if(e.key==='ArrowLeft') move(k,0,-1,e);
  else if(e.key==='ArrowDown') move(k,1,0,e);
  else if(e.key==='ArrowUp') move(k,-1,0,e);
}
function move(k,dr,dc,e){
  const [r,c]=k.split(',').map(Number);
  for(let s=1;s<20;s++){const nk=key(r+dr*s,c+dc*s); if(inputs.has(nk)){inputs.get(nk).focus();e.preventDefault();return;} if(!cellMap.has(nk)&&(r+dr*s<0||c+dc*s<0||r+dr*s>=DATA.rows||c+dc*s>=DATA.cols))return;}
}

function updateProgress(){
  let filled=0; inputs.forEach(i=>{if(i.value)filled++;});
  document.getElementById('prog').innerHTML=`<b>${filled}</b> / ${inputs.size}`;
  updateSolBar();
}

// oplossingsbalk: genummerde vakjes die meevullen vanuit de cirkelcellen
function buildSolBar(){
  const bar=document.getElementById('solbar'), wrap=document.getElementById('sol-cells');
  wrap.innerHTML='';
  bar.hidden=!SOL;
  if(!SOL) return;
  SOL.cells.forEach((c,i)=>{
    const d=document.createElement('div'); d.className='sol-cell';
    d.innerHTML=`<span class="n">${i+1}</span><span class="v"></span>`;
    d.title='Vakje '+(i+1);
    d.addEventListener('click',()=>{const inp=inputs.get(key(c.r,c.c)); if(inp) inp.focus();});
    wrap.appendChild(d);
  });
  updateSolBar();
}
function updateSolBar(){
  if(!SOL) return;
  document.querySelectorAll('#sol-cells .sol-cell .v').forEach((el,i)=>{
    const inp=inputs.get(key(SOL.cells[i].r,SOL.cells[i].c));
    el.textContent=(inp&&inp.value)?inp.value:'';
  });
}

// --- voortgang bewaren in localStorage, per ISO-week -------------------------
// sleutel bevat de roostervingerafdruk zodat een geregenereerd rooster
// (zelfde jaar/week, andere indeling) niet de oude voortgang overneemt
function storeKeyFor(weekData){
  return 'nieuwsraadsel-'+(weekData.year||'')+'-W'+(weekData.week||'')+(weekData.gen?'-'+weekData.gen:'');
}
function saveProgress(){
  try{
    const o={}; inputs.forEach((inp,k)=>{ if(inp.value) o[k]=inp.value; });
    if(Object.keys(o).length) localStorage.setItem(STORE_KEY,JSON.stringify(o));
    else localStorage.removeItem(STORE_KEY);
  }catch(e){}
}
function restoreProgress(){
  try{
    const raw=localStorage.getItem(STORE_KEY); if(!raw) return;
    const o=JSON.parse(raw);
    for(const k in o){ const inp=inputs.get(k); if(inp) inp.value=o[k]; }
    updateProgress();
  }catch(e){}
}
function clearProgress(){ try{ localStorage.removeItem(STORE_KEY); }catch(e){} }
function pruneOld(){            // alleen weken bewaren die nog in het archief staan
  try{
    const keep=new Set(WEEKS.map(storeKeyFor));
    for(let i=localStorage.length-1;i>=0;i--){
      const k=localStorage.key(i);
      if(k && k.startsWith('nieuwsraadsel-') && !keep.has(k)) localStorage.removeItem(k);
    }
  }catch(e){}
}

document.getElementById('btn-check').onclick=()=>{
  let wrong=0,empty=0;
  inputs.forEach((inp,k)=>{
    inp.parentElement.classList.remove('ok','bad');
    const sol=cellMap.get(k).sol;
    if(!inp.value){empty++;return;}
    if(inp.value===sol) inp.parentElement.classList.add('ok');
    else {inp.parentElement.classList.add('bad'); wrong++;}
  });
  const s=document.getElementById('status');
  if(wrong===0&&empty===0){s.className='status win';
    s.textContent='✓ Helemaal goed'+(SOL?' — woord van de week: '+SOL.display+(SOL.desc?' ('+SOL.desc+')':''):'');}
  else if(wrong===0){s.className='status';s.textContent=`Goed bezig: nog ${empty} ${empty===1?'vakje':'vakjes'} te gaan, geen fouten.`;}
  else {s.className='status miss';s.textContent=`${wrong} ${wrong===1?'letter klopt':'letters kloppen'} nog niet (rood gemarkeerd).`;}
  setTimeout(()=>inputs.forEach(i=>i.parentElement.classList.remove('ok','bad')),2600);
};
// --- delen via de URL-hash ("Help!") ---------------------------------------
function encodeShare(p){
  return encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(p)))));
}
function decodeShare(str){
  try{ return JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(str))))); }
  catch(e){ return null; }
}
function findWeekIdx(y,w){ return WEEKS.findIndex(d=>d.year===y&&d.week===w); }

document.getElementById('btn-help').onclick=async()=>{
  const c={}; inputs.forEach((inp,k)=>{ if(inp.value) c[k]=inp.value; });
  const payload={y:DATA.year,w:DATA.week,g:DATA.gen,c};
  const url=location.href.split('#')[0]+'#s='+encodeShare(payload);
  const status=document.getElementById('status');
  status.className='status';
  try{
    if(navigator.share){ await navigator.share({url}); return; }
    await navigator.clipboard.writeText(url);
    status.textContent="Link gekopieerd — stuur 'm naar iemand die met je meepuzzelt.";
  }catch(e){
    status.textContent=url;
  }
};
document.getElementById('btn-clear').onclick=()=>{
  inputs.forEach(i=>{i.value='';i.parentElement.classList.remove('ok','bad');});
  document.getElementById('status').textContent=''; document.getElementById('status').className='status';
  updateProgress(); clearProgress();
};
document.getElementById('btn-print').onclick=()=>window.print();
// bij afdrukken: aanwijzingenlijst openklappen en de vaste A4-celgrootte laten gelden
window.addEventListener('beforeprint',()=>{
  const d=document.querySelector('details'); if(d) d.open=true;
  board.style.removeProperty('--cs');
});
window.addEventListener('afterprint',fitBoard);

// bronnenlijst
function buildList(){
  const wrap=document.getElementById('cluelist');
  const hor=[],ver=[];
  DATA.words.forEach(w=>{
    const dr=w.dir==='H'?0:1,dc=w.dir==='H'?1:0;
    const cd=cellMap.get(key(w.r-dr,w.c-dc));
    const cl=cd?.clues?.find(x=>wordForClue(cd,x)===w);
    (w.dir==='H'?hor:ver).push({t:cl?cl.text:'',num:cl?cl.num:0,w});
  });
  hor.sort((a,b)=>a.num-b.num); ver.sort((a,b)=>a.num-b.num);
  const sec=(title,arr)=>{
    let h=`<div class="cluecol"><div style="break-after:avoid;font-family:var(--narrow);font-weight:700;color:var(--accent-deep);margin:4px 0 6px">${title}</div>`;
    arr.forEach(o=>{h+=`<div data-k="${o.w.cells[0]}"><span class="n">${o.num}</span>${o.t}</div>`;});
    return h+'</div>';
  };
  wrap.innerHTML=sec('→ Horizontaal',hor)+sec('↓ Verticaal',ver);
  wrap.querySelectorAll('[data-k]').forEach(el=>el.addEventListener('click',()=>{
    const k=el.dataset.k; active.word=wordsAt.get(k).find(w=>w.cells[0]===k)||wordsAt.get(k)[0];
    inputs.get(k).focus();
  }));
}

// weeknummer in de kop + titel + staat van de weeknavigatie
function applyWeekChrome(){
  const wk=DATA.week;
  document.getElementById('ed-week').textContent='Week '+wk;
  document.title='NOS Nieuwsraadsel';
  document.getElementById('ed-footer').textContent='Nieuwsraadsel · gemaakt op basis van nos.nl · Week '+wk;
  // WEEKS is nieuwste-eerst: ‹ (ouder) = current+1, › (nieuwer) = current-1
  document.getElementById('wk-prev').disabled = current >= WEEKS.length-1;
  document.getElementById('wk-next').disabled = current <= 0;
}

// rooster passend maken: celgrootte volgt de beschikbare breedte en het
// aantal kolommen (dat per puzzel verschilt), zodat het bord altijd past.
function fitBoard(){
  const scroll=board.parentElement;            // .board-scroll
  const avail=scroll.clientWidth-28;           // minus 14px padding links+rechts
  const fit=Math.floor((avail-4-(DATA.cols-1))/DATA.cols); // rand 2*2 + 1px gaps
  board.style.setProperty('--cs',Math.max(18,Math.min(42,fit))+'px');
}

// weeknavigatie: spring naar week-index i (0 = nieuwste)
function goWeek(i){
  if(i<0||i>=WEEKS.length) return;
  current=i;
  mount(WEEKS[current]);
}
document.getElementById('wk-prev').onclick=()=>goWeek(current+1); // ouder
document.getElementById('wk-next').onclick=()=>goWeek(current-1); // nieuwer

// gedeelde link ontvangen: hash "#s=..." bevat een puzzelstand van een ander
function receiveShare(){
  const m=location.hash.match(/^#s=(.+)$/);
  if(!m) return;
  const shared=decodeShare(m[1]);
  history.replaceState(null,'',location.pathname+location.search);
  if(!shared) return;
  const idx=findWeekIdx(shared.y,shared.w);
  if(idx<0){
    document.getElementById('status').textContent='Die gedeelde puzzel (week '+shared.w+') is niet meer beschikbaar.';
    return;
  }
  if(shared.g && WEEKS[idx].gen && shared.g!==WEEKS[idx].gen){
    document.getElementById('status').textContent='Die gedeelde puzzel (week '+shared.w+') is verlopen: het rooster is inmiddels vernieuwd.';
    return;
  }
  current=idx;
  mount(WEEKS[current]);
  let hasOwnProgress=false;
  inputs.forEach(inp=>{ if(inp.value) hasOwnProgress=true; });
  if(!hasOwnProgress || confirm('Iemand deelde een puzzel met je. Overnemen? Je eigen voortgang voor deze week wordt vervangen.')){
    for(const k in shared.c){ const inp=inputs.get(k); if(inp) inp.value=shared.c[k]; }
    updateProgress(); saveProgress();
  }
}

pruneOld();
mount(WEEKS[current]);
receiveShare();
window.addEventListener('resize',fitBoard);
window.addEventListener('orientationchange',fitBoard);
</script>
